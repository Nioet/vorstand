# Optional: Kostenlose Supabase-Projekte werden nach längerer Ruhe pausiert.
# Dieser Ablauf ruft einmal täglich den Kalender ab und hält das Projekt so wach.
# Einrichten: Im GitHub-Repo unter Settings → Secrets and variables → Actions
# ein Secret "KALENDER_URL" mit dem kompletten Abo-Link (https://…) anlegen.
name: Supabase wach halten
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kalender abrufen
        env:
          KALENDER_URL: ${{ secrets.KALENDER_URL }}
        run: |
          if [ -z "$KALENDER_URL" ]; then echo "Secret KALENDER_URL fehlt – übersprungen."; exit 0; fi
          curl -fsS -o /dev/null "$KALENDER_URL" && echo "OK"
